<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sipariş — Astro Yuvam</title>
<style>
  :root{--bg:#0c0914;--panel:#161022;--line:#2a2140;--gold:#d9b96a;--gold2:#c9a34e;--ink:#efe9dc;--muted:#9a90b5;--violet:#7c6cf0}
  *{box-sizing:border-box;margin:0}
  body{background:radial-gradient(ellipse at 50% -10%,#1d1533 0%,var(--bg) 60%);min-height:100vh;font-family:Georgia,serif;color:var(--ink)}
  header{padding:22px 34px;border-bottom:1px solid var(--line)}
  header .logo{color:var(--gold);font-size:20px;letter-spacing:1px}
  .card{max-width:520px;margin:48px auto;background:var(--panel);border:1px solid var(--gold2);border-radius:14px;padding:38px 34px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .badge{text-align:center;color:var(--gold);font-size:12px;letter-spacing:3px;margin-bottom:14px}
  .rname{text-align:center;color:var(--muted);font-size:15px}
  .price{text-align:center;font-size:38px;margin:14px 0 26px}
  label{display:block;font-size:12px;color:var(--muted);letter-spacing:.5px;margin:16px 0 6px;font-weight:bold}
  input,select{width:100%;padding:12px 14px;background:#0f0b1a;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:inherit;font-size:14px}
  input:focus{outline:none;border-color:var(--gold2)}
  .row{display:flex;gap:12px}.row>div{flex:1}
  .genders{display:flex;gap:12px}
  .genders button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line);background:#0f0b1a;color:var(--ink);font-family:inherit;cursor:pointer}
  .genders button.active{background:var(--violet);border-color:var(--violet);font-weight:bold}
  fieldset{border:1px dashed var(--line);border-radius:10px;padding:6px 16px 16px;margin-top:22px;display:none}
  fieldset.show{display:block}
  legend{color:var(--gold);font-size:13px;padding:0 8px}
  .submit{width:100%;margin-top:26px;padding:15px;border:none;border-radius:9px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#241a06;font-weight:bold;font-size:15px;letter-spacing:1px;cursor:pointer;font-family:inherit}
  .submit:disabled{opacity:.55;cursor:wait}
  .note{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
  .status{margin-top:18px;padding:14px;border-radius:9px;font-size:14px;text-align:center;display:none;line-height:1.7}
  .status.ok{display:block;background:#122016;border:1px solid #2e5b3a;color:#a9e0b5}
  .status.err{display:block;background:#241014;border:1px solid #6b2a35;color:#f0a9b5}
</style>
</head>
<body>
<header><div class="logo">✦ Astro Yuvam</div></header>

<div class="card">
  <div class="badge">✦ EN ÇOK TERCİH EDİLEN ✦</div>
  <div class="rname" id="reportName">Rapor</div>
  <div class="price" id="price">—</div>

  <label>Ad Soyad *</label>
  <input id="name" placeholder="Rapor için ad soyadı">

  <label>E-posta *</label>
  <input id="email" type="email" placeholder="Rapor bu adrese gönderilecek">

  <div class="row">
    <div><label>Doğum Tarihi *</label><input id="birthDate" type="date"></div>
    <div><label>Saat * (bilmiyorsan 12:00)</label><input id="birthTime" type="time" value="12:00"></div>
  </div>

  <label>Cinsiyet</label>
  <div class="genders" id="genderBox">
    <button type="button" data-g="Kadın" class="active">Kadın</button>
    <button type="button" data-g="Erkek">Erkek</button>
  </div>

  <label>Doğum Yeri *</label>
  <input id="birthPlace" placeholder="Şehir, Ülke (örn: İstanbul, Türkiye)">

  <label id="relLabel">İlişki Durumun *</label>
  <div class="genders" id="relBox" style="flex-wrap:wrap"></div>

  <fieldset id="partnerBox">
    <legend>Partner Bilgileri</legend>
    <label>Partner Ad Soyad *</label>
    <input id="pName" placeholder="Partnerin adı soyadı">
    <div class="row">
      <div><label>Doğum Tarihi *</label><input id="pDate" type="date"></div>
      <div><label>Saat</label><input id="pTime" type="time" value="12:00"></div>
    </div>
    <label>Doğum Yeri *</label>
    <input id="pPlace" placeholder="Şehir, Ülke">
  </fieldset>

  <button class="submit" id="btn">RAPORUNU SİPARİŞ ET →</button>
  <label style="display:flex;align-items:flex-start;gap:9px;margin-top:20px;font-weight:normal;cursor:pointer;line-height:1.5">
    <input type="checkbox" id="consent" style="width:auto;margin-top:3px;flex:none">
    <span style="font-size:12.5px;color:var(--muted)">
      <a href="gizlilik-kvkk.html" target="_blank" style="color:var(--gold)">KVKK Aydınlatma Metni & Gizlilik Politikası</a>'nı ve
      <a href="mesafeli-satis.html" target="_blank" style="color:var(--gold)">Mesafeli Satış Sözleşmesi</a>'ni okudum; kişisel verilerimin (ve ilişki raporlarında partner bilgilerinin) rapor amacıyla işlenmesini kabul ediyorum.
    </span>
  </label>

  <div class="note">🔒 Sonraki adımda güvenli <strong>Shopier</strong> ödeme sayfasına yönlendirileceksin. Ödeme ekranında da <strong>aynı e-posta adresini</strong> kullan ki raporun sana ulaşsın.</div>
  <div class="status" id="status"></div>
</div>

<script>
// BURAYI DEĞİŞTİRİN: Render/Railway'e deploy ettiğiniz backend adresi
const API = "https://astro-rapor.onrender.com";

const REPORTS = {
  natal:        { name: "Haritanı Tanı Raporu",       price: 500 },
  solar_return: { name: "Solar Return Raporu",        price: 250 },
  lunar_return: { name: "Lunar Return Raporu",        price: 150 },
  sinastri:     { name: "Sinastri Raporu",            price: 500 },
  matrix:       { name: "Kader Matrisi Raporu",       price: 400 },
  matrix_uyum:  { name: "Kader Matrisi Uyum Raporu",  price: 500 },
  transit:      { name: "Transit Raporu",             price: 300 }
};
const type = new URLSearchParams(location.search).get("type") || "natal";
const info = REPORTS[type] || REPORTS.natal;
document.getElementById("reportName").textContent = info.name;
document.getElementById("price").innerHTML = "&#8378;" + info.price + " <span style='font-size:16px;color:var(--muted)'>tek seferlik</span>";

const needsPartner = ["sinastri","matrix_uyum"].includes(type);
if (needsPartner) document.getElementById("partnerBox").classList.add("show");

// İlişki durumu seçenekleri — çift raporlarında farklı, tekli raporlarda farklı
const REL_TEKLI = ["Bekar","İlişkim var","Nişanlı","Evli","Boşanmış"];
const REL_CIFT  = ["Yeni tanışıyoruz","Flört/İlişki","Nişanlı","Evli"];
document.getElementById("relLabel").textContent = needsPartner ? "İlişkiniz Ne Aşamada? *" : "İlişki Durumun *";
let relationship = "";
const relBox = document.getElementById("relBox");
(needsPartner ? REL_CIFT : REL_TEKLI).forEach(opt => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = opt; b.style.flex = "1 1 30%";
  b.onclick = () => {
    relBox.querySelectorAll("button").forEach(x => x.classList.remove("active"));
    b.classList.add("active"); relationship = opt;
  };
  relBox.appendChild(b);
});

let gender = "Kadın";
const genderBox = document.getElementById("genderBox");
genderBox.querySelectorAll("button").forEach(b => b.onclick = () => {
  genderBox.querySelectorAll("button").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); gender = b.dataset.g;
});

const $ = id => document.getElementById(id).value.trim();
const statusEl = document.getElementById("status");
const btn = document.getElementById("btn");

btn.onclick = async () => {
  if (!document.getElementById("consent").checked) {
    statusEl.className = "status err";
    statusEl.textContent = "Devam etmek için KVKK ve satış sözleşmesi onayını işaretlemelisin.";
    return;
  }
  if (!relationship) {
    statusEl.className = "status err";
    statusEl.textContent = needsPartner ? "Lütfen ilişkinizin aşamasını seçin." : "Lütfen ilişki durumunu seç.";
    return;
  }
  const body = {
    type, name: $("name"), email: $("email"),
    birthDate: $("birthDate"), birthTime: $("birthTime") || "12:00",
    birthPlace: $("birthPlace"), gender, relationship
  };
  if (needsPartner) body.partner = { name: $("pName"), birthDate: $("pDate"), birthTime: $("pTime") || "12:00", birthPlace: $("pPlace") };

  btn.disabled = true; btn.textContent = "GÖNDERİLİYOR…";
  statusEl.className = "status";
  try {
    const res = await fetch(API + "/api/order", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error((data.errors || [data.error || "Bilinmeyen hata"]).join(" "));
    statusEl.className = "status ok";
    statusEl.innerHTML = "✦ Bilgilerin alındı — güvenli ödeme sayfasına yönlendiriliyorsun…<br><span style='font-size:12.5px;opacity:.85'>Ödeme ekranında da <strong>aynı e-posta adresini</strong> kullan. Ödeme onaylanınca raporun otomatik hazırlanıp e-postana gönderilecek.</span>";
    btn.textContent = "ÖDEMEYE GİDİLİYOR…";
    // Ödeme Shopier'de alınır; onay webhook'u gelince rapor sunucuda otomatik üretilir.
    if (data.paymentUrl) { setTimeout(() => { window.location.href = data.paymentUrl; }, 1000); return; }
    // paymentUrl beklenmedik şekilde gelmezse bilgilendir:
    statusEl.innerHTML = "✦ " + (data.message || "Siparişin alındı.");
    btn.disabled = false; btn.textContent = "RAPORUNU SİPARİŞ ET →";
  } catch (e) {
    statusEl.className = "status err";
    statusEl.textContent = "Sipariş alınamadı: " + e.message;
    btn.disabled = false; btn.textContent = "RAPORUNU SİPARİŞ ET →";
  }
};

async function poll(id) {
  const t = setInterval(async () => {
    try {
      const r = await fetch(`${API}/api/order/${id}`);
      const d = await r.json();
      if (d.status === "done") {
        clearInterval(t);
        statusEl.className = "status ok";
        statusEl.textContent = "✅ Raporun hazırlandı ve e-postana gönderildi! Gelen kutunu (ve spam klasörünü) kontrol et.";
        btn.textContent = "TAMAMLANDI ✦";
      } else if (d.status === "failed") {
        clearInterval(t);
        statusEl.className = "status err";
        statusEl.textContent = "Rapor üretilirken bir sorun oluştu. Lütfen bizimle iletişime geç.";
        btn.disabled = false; btn.textContent = "TEKRAR DENE →";
      }
    } catch {}
  }, 5000);
}
</script>
</body>
</html>
