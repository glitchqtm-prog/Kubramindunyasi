<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profilim · Astro Yuvam</title>
<meta name="description" content="Astro Yuvam hesap bilgilerini görüntüle ve doğum bilgilerini düzenle.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/logo-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#14101f; --panel:#1d1730; --field:#241d38; --field-2:#2c2447;
    --gold:#d9b96a; --gold-soft:#e7cf95; --cream:#f0e6d2;
    --muted:rgba(240,230,210,.58); --line:rgba(217,185,106,.22);
    --error:#e7a17a; --ok:#a9d3a0; color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:
      radial-gradient(1100px 620px at 50% -160px, rgba(217,185,106,.13), transparent 70%),
      radial-gradient(900px 500px at 85% 110%, rgba(120,90,180,.10), transparent 70%),
      var(--bg);
    color:var(--cream);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      radial-gradient(1.4px 1.4px at 20% 30%, rgba(240,230,210,.35), transparent),
      radial-gradient(1.2px 1.2px at 70% 20%, rgba(240,230,210,.28), transparent),
      radial-gradient(1.3px 1.3px at 40% 75%, rgba(240,230,210,.22), transparent),
      radial-gradient(1.1px 1.1px at 88% 62%, rgba(240,230,210,.30), transparent),
      radial-gradient(1.2px 1.2px at 12% 82%, rgba(240,230,210,.20), transparent);
  }
  .wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:34px 16px 60px;}
  .card{
    width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:36px 30px 30px;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.7), 0 0 60px -30px rgba(217,185,106,.32);
    animation:rise .6s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){.card{animation:none;}}

  .brand{text-align:center;margin-bottom:22px;}
  .brand img{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);box-shadow:0 0 26px -6px rgba(217,185,106,.5);}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:28px;letter-spacing:.3px;margin:14px 0 6px;color:var(--gold-soft);}
  .brand p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5;}

  .state{display:none;}
  .state.show{display:block;}
  .center{text-align:center;}

  form{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .field-group{display:flex;flex-direction:column;gap:6px;}
  .row{display:flex;gap:12px;}
  .row .field-group{flex:1;}
  label{font-size:13px;color:var(--muted);padding-left:2px;}
  input[type=text],input[type=date],input[type=time]{
    width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;
    padding:13px 14px;color:var(--cream);font-family:inherit;font-size:15px;
    transition:border-color .2s,box-shadow .2s;
  }
  input::placeholder{color:rgba(240,230,210,.32);}
  input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,185,106,.18);}
  input[type=date],input[type=time]{color-scheme:dark;}
  .readonly-box{
    background:rgba(217,185,106,.05);border:1px dashed var(--line);border-radius:10px;
    padding:13px 14px;color:var(--muted);font-size:15px;word-break:break-all;
  }
  .birth-note{
    font-size:12px;color:var(--muted);line-height:1.5;
    background:rgba(217,185,106,.06);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  }

  .submit{
    margin-top:4px;border:0;border-radius:11px;padding:14px;font-family:inherit;font-size:15.5px;font-weight:600;
    color:#1a1428;background:linear-gradient(180deg,var(--gold-soft),var(--gold));cursor:pointer;
    transition:filter .2s,transform .05s;
  }
  .submit:hover{filter:brightness(1.06);}
  .submit:active{transform:translateY(1px);}
  .submit:disabled{opacity:.6;cursor:default;filter:none;}
  .submit:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;}

  .msg{margin-top:14px;font-size:14px;line-height:1.55;padding:12px 14px;border-radius:10px;display:none;}
  .msg.show{display:block;}
  .msg.error{background:rgba(231,161,122,.10);border:1px solid rgba(231,161,122,.4);color:var(--error);}
  .msg.ok{background:rgba(169,211,160,.10);border:1px solid rgba(169,211,160,.4);color:var(--ok);}

  .ghost-btn{
    width:100%;margin-top:14px;border:1px solid var(--line);background:transparent;color:var(--cream);
    font-family:inherit;font-size:15px;font-weight:500;padding:12px 22px;border-radius:11px;cursor:pointer;
    transition:background .2s,border-color .2s;
  }
  .ghost-btn:hover{background:var(--field);border-color:var(--gold);}
  .ghost-btn:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;}

  .gold-btn{
    display:inline-block;margin-top:6px;border:0;border-radius:11px;padding:13px 26px;font-family:inherit;
    font-size:15px;font-weight:600;color:#1a1428;background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    cursor:pointer;text-decoration:none;
  }
  .foot{margin-top:20px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.6;}
  .foot a{color:var(--gold-soft);text-decoration:none;}
  .foot a:hover{text-decoration:underline;}
  .loading{color:var(--muted);font-size:14px;text-align:center;padding:16px 0;}
</style>
</head>
<body>

<div id="astro-menu"></div>

<div class="wrap">
  <main class="card">

    <div class="brand">
      <img src="/logo-512.png" alt="Astro Yuvam">
      <h1>Profilim</h1>
      <p>Bilgilerini görüntüle ve güncelle.</p>
    </div>

    <!-- Yükleniyor -->
    <div class="state show" id="loadingState">
      <div class="loading">Yükleniyor…</div>
    </div>

    <!-- Giriş gerekli -->
    <div class="state" id="needLoginState">
      <p class="center" style="color:var(--muted);font-size:14px;line-height:1.6;margin:6px 0 18px;">
        Bu sayfayı görmek için giriş yapman gerekiyor.
      </p>
      <div class="center"><a href="/giris.html" class="gold-btn">Giriş Yap</a></div>
      <div class="foot"><a href="/">← Ana sayfaya dön</a></div>
    </div>

    <!-- Profil formu -->
    <div class="state" id="profileState">
      <form id="profileForm" autocomplete="on" novalidate>

        <div class="field-group">
          <label>E-posta</label>
          <div class="readonly-box" id="emailBox">—</div>
        </div>

        <div class="field-group">
          <label for="name">Ad Soyad</label>
          <input type="text" id="name" placeholder="Adın soyadın" autocomplete="name">
        </div>

        <div class="row">
          <div class="field-group">
            <label for="birthDate">Doğum Tarihi</label>
            <input type="date" id="birthDate">
          </div>
          <div class="field-group">
            <label for="birthTime">Doğum Saati</label>
            <input type="time" id="birthTime">
          </div>
        </div>

        <div class="field-group">
          <label for="birthPlace">Doğum Yeri</label>
          <input type="text" id="birthPlace" placeholder="Örn. Adana, Türkiye">
        </div>

        <div class="birth-note">
          Doğum bilgin isteğe bağlı. Eklersen, ileride sana özel günlük ve haftalık yorumlar sunabiliriz.
        </div>

        <button type="submit" class="submit" id="saveBtn">Kaydet</button>
      </form>

      <div class="msg" id="msg" role="status" aria-live="polite"></div>

      <button type="button" class="ghost-btn" id="logoutBtn">Çıkış Yap</button>
      <div class="foot"><a href="/">← Ana sayfaya dön</a></div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/menu.js" defer></script>

<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://htyywgmgbmzhrqtgihqd.supabase.co";
  var SUPABASE_KEY = "sb_publishable_S1Bm79ihKGNyjY7R7yIwfQ_U4K6JJYM";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var loadingState = document.getElementById("loadingState");
  var needLoginState = document.getElementById("needLoginState");
  var profileState = document.getElementById("profileState");
  var emailBox = document.getElementById("emailBox");
  var nameEl = document.getElementById("name");
  var birthDateEl = document.getElementById("birthDate");
  var birthTimeEl = document.getElementById("birthTime");
  var birthPlaceEl = document.getElementById("birthPlace");
  var form = document.getElementById("profileForm");
  var saveBtn = document.getElementById("saveBtn");
  var msg = document.getElementById("msg");
  var logoutBtn = document.getElementById("logoutBtn");

  function show(state){
    loadingState.classList.remove("show");
    needLoginState.classList.remove("show");
    profileState.classList.remove("show");
    state.classList.add("show");
  }
  function showMsg(text, type){
    msg.textContent = text;
    msg.className = "msg show " + (type === "ok" ? "ok" : "error");
  }
  function clearMsg(){ msg.className = "msg"; msg.textContent = ""; }

  function doldur(user){
    var m = (user && user.user_metadata) ? user.user_metadata : {};
    emailBox.textContent = user.email || "—";
    nameEl.value = m.full_name || "";
    birthDateEl.value = m.birth_date || "";
    birthTimeEl.value = m.birth_time || "";
    birthPlaceEl.value = m.birth_place || "";
  }

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    clearMsg();
    saveBtn.disabled = true;
    saveBtn.textContent = "Kaydediliyor…";
    try{
      var res = await sb.auth.updateUser({
        data: {
          full_name: nameEl.value.trim(),
          birth_date: birthDateEl.value || "",
          birth_time: birthTimeEl.value || "",
          birth_place: birthPlaceEl.value.trim()
        }
      });
      if(res.error){ showMsg("Kaydedilemedi. Lütfen tekrar dene.", "error"); }
      else{ showMsg("Bilgilerin kaydedildi ✓", "ok"); }
    }catch(err){
      showMsg("Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.", "error");
    }finally{
      saveBtn.disabled = false;
      saveBtn.textContent = "Kaydet";
    }
  });

  logoutBtn.addEventListener("click", async function(){
    logoutBtn.disabled = true;
    try{ await sb.auth.signOut(); }catch(e){}
    window.location.href = "/giris.html";
  });

  (async function init(){
    try{
      var sess = await sb.auth.getSession();
      if(sess && sess.data && sess.data.session){
        doldur(sess.data.session.user);
        show(profileState);
      }else{
        show(needLoginState);
      }
    }catch(e){
      show(needLoginState);
    }
  })();

})();
</script>

</body>
</html>
