name: Haftalık Burç Yorumları

on:
  schedule:
    - cron: "37 3 * * *"      # her gün 03:37 UTC; yalnızca ISO hafta değişince yeni yorum üretir (aksi hâlde API çağrısı yapmaz)
  workflow_dispatch:          # "Run workflow" ile elle de tetiklenebilir
    inputs:
      force_weekly:
        description: "Haftalık yorumları da yeniden üret (aynı hafta olsa bile)"
        type: boolean
        default: false

permissions:
  contents: write             # oluşan sayfaları repoya commit'lemek için

concurrency:
  group: gunluk-burc
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılık (astronomy-engine)
        run: npm install --no-save astronomy-engine

      - name: Yorumları üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          FORCE_WEEKLY: ${{ inputs.force_weekly }}
        run: node gen-burc.mjs

      - name: Değişiklikleri commit'le
        run: |
          git config user.name "astro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add haftalik-burc-yorumlari.html haftalik-burc-yorumlari sitemap.xml
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Haftalık burç yorumları güncellendi: $(TZ=Europe/Istanbul date +%F)"
            git pull --rebase
            git push
          fi
