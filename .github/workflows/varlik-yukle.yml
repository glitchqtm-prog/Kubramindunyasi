name: Üye sayfaları ve Yıldız Günlüğü görselleri (tek seferlik yükleme)

# Yalnızca yeni-anasayfa dalında, bu dosya değiştiğinde bir kez çalışır; sonra silinir, main'e taşınmaz.
on:
  push:
    branches: [yeni-anasayfa]
    paths:
      - ".github/workflows/varlik-yukle.yml"

permissions:
  contents: write

jobs:
  yukle:
    runs-on: ubuntu-latest
    steps:
      - name: Dalı al
        uses: actions/checkout@v4

      - name: İndir, doğrula, aç
        run: |
          curl -fsSL -o /tmp/v.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3LyFYhOxtdwTi9S3VyJYumAMkN8/143f86c8-8a4a-4eed-b01f-092e75a12e84.zip"
          echo "5a5c7dd7485e76db6c49ef4d1640996982296335119de629c047ebd4f7a95ff0  /tmp/v.zip" | sha256sum -c -
          unzip -o -q /tmp/v.zip -d .
          ls -la ay-uye-*.webp yg-*.webp

      - name: Dala ekle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ay-uye-giris.webp ay-uye-ufuk.webp yg-ust.webp yg-burclar.webp yg-gezegenler.webp yg-numeroloji.webp yg-ask-iliski.webp yg-hesaplamalar.webp
          git commit -m "Üye sayfaları ve Yıldız Günlüğü görselleri"
          git push
