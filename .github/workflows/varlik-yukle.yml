name: Ana sayfa filmi ve görselleri (tek seferlik yükleme)

# Yalnızca yeni-anasayfa dalında, bu dosya değiştiğinde bir kez çalışır.
# Üretilen film kareleri ve görseller dala eklendikten sonra bu dosya silinir; main'e taşınmaz.
on:
  push:
    branches: [yeni-anasayfa]
    paths:
      - ".github/workflows/varlik-yukle.yml"

permissions:
  contents: write

jobs:
  yukle:
    runs-on: ubuntu-latest
    steps:
      - name: Dalı al
        uses: actions/checkout@v4

      - name: Dosyaları indir, doğrula, aç
        run: |
          curl -fsSL -o /tmp/v.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3LyFYhOxtdwTi9S3VyJYumAMkN8/d4291b53-24bc-4588-9b7c-68587ac3a5ba.zip"
          echo "4184fafacf9e8df4dc5ee7e9f06730e970f568060190bd3b5da3b06e8570c902  /tmp/v.zip" | sha256sum -c -
          unzip -o -q /tmp/v.zip -d .
          ls film | wc -l

      - name: Dala ekle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add film ay-kat-*.webp ay-kapanis.mp4 ay-kapanis.webp
          git commit -m "Ana sayfa: açılış filmi kareleri, rapor grubu görselleri, kapanış filmi"
          git push
