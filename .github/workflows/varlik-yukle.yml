name: Önizleme örnek verisi (tek seferlik yükleme)

# Yalnızca yeni-anasayfa dalında, bu dosya değiştiğinde bir kez çalışır; sonra silinir, main'e taşınmaz.
on:
  push:
    branches: [yeni-anasayfa]
    paths:
      - ".github/workflows/varlik-yukle.yml"

permissions:
  contents: write

jobs:
  yukle:
    runs-on: ubuntu-latest
    steps:
      - name: Dalı al
        uses: actions/checkout@v4

      - name: İndir, doğrula, aç
        run: |
          curl -fsSL -o /tmp/v.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3LyFYhOxtdwTi9S3VyJYumAMkN8/6b87c8ee-65ae-40bc-8abf-0bbc1eac7f8a.zip"
          echo "7ff36c7d1531e5934312fde5e633653785e90e6b159707b7eeb4044463b26446  /tmp/v.zip" | sha256sum -c -
          unzip -o -q /tmp/v.zip -d .
          ls -la onizleme

      - name: Dala ekle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onizleme/veri.json
          git commit -m "Önizleme: örnek üye verisi"
          git push
